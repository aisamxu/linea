name: CI

on:
  # 只在推送 v* 版本标签时构建，避免日常分支和 PR 反复占用 macOS runner；
  # workflow_dispatch 用于手动构建候选包，此时没有 tag，跳过版本一致性断言。
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Apple silicon)
    # macos-15 是 public 仓库可用的 arm64 标准 runner；
    # macos-26 仍是 public preview，容量/排队不稳定。
    # 镜像默认 Xcode 为 16.4，下面会显式选择已安装的 Xcode 26.x。
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|rc' | tail -n 1)"
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          test "$(uname -m)" = "arm64"
          # 不能把 xcodebuild 输出接给 head/grep -q：它们提前关闭管道会让
          # xcodebuild 写入已断开的 stdout 并崩溃（Broken pipe）。
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          XCODE_VERSION="${XCODE_VERSION_OUTPUT%%$'\n'*}"
          if [[ "$XCODE_VERSION" != Xcode\ 26* ]]; then
            echo "需要 Xcode 26，实际为: $XCODE_VERSION"
            exit 1
          fi

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Linea.xcodeproj \
            -scheme Linea \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=NO

      - name: Build Release app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Linea.xcodeproj \
            -scheme Linea \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            ENABLE_HARDENED_RUNTIME=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Ad-hoc sign app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Linea.app"

          # 免费发布方案：为完整 .app 做 ad-hoc 签名，修复未签名 bundle
          # 从浏览器下载后被 Gatekeeper 误判为“已损坏”的问题。
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          SIGN_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          echo "$SIGN_INFO"
          echo "$SIGN_INFO" | grep -qx 'Identifier=com.samxu.Linea'
          echo "$SIGN_INFO" | grep -qx 'Signature=adhoc'

      - name: Validate app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Linea.app"
          EXEC="$APP/Contents/MacOS/Linea"
          PLIST="$APP/Contents/Info.plist"

          test -d "$APP"
          test -x "$EXEC"
          test -d "$APP/Contents/_CodeSignature"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ARCHS="$(lipo -archs "$EXEC" | tr -s '[:space:]' '\n' | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$ARCHS" = "arm64"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$PLIST" | grep -qx 'AppIcon'
          test -s "$APP/Contents/Resources/Assets.car"

          MIN_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")"
          python3 - "$MIN_VERSION" <<'PY'
          import sys
          version = sys.argv[1]
          parts = tuple(int(part) for part in version.split("."))
          if parts < (14, 0):
              raise SystemExit(f"LSMinimumSystemVersion {version} is below 14.0")
          print(f"LSMinimumSystemVersion: {version}")
          PY

          # 版本号以构建出的 Info.plist 为唯一事实源，CI 不再维护第二份硬编码；
          # 升级版本只需改 project.yml。
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          test -n "$APP_VERSION"
          test -n "$APP_BUILD"
          # tag 触发时必须保证 tag 与 app 版本一致（如 v1.0.2、v1.1.0-rc.1）；
          # workflow_dispatch 是分支构建，GITHUB_REF_TYPE 为 branch，跳过该断言。
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v${APP_VERSION}" && "$GITHUB_REF_NAME" != "v${APP_VERSION}-"* ]]; then
              echo "tag $GITHUB_REF_NAME 与 app 版本 $APP_VERSION 不一致" >&2
              exit 1
            fi
          fi

          echo "Version: $APP_VERSION ($APP_BUILD)"
          echo "Architecture: $ARCHS"
          echo "Signature:"
          codesign -dv --verbose=4 "$APP" 2>&1
          echo "Gatekeeper assessment (informational; ad-hoc is not notarized):"
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 || true

      - name: Package DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Linea.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          DMG="Linea-${VERSION}-macos-arm64.dmg"
          STAGE="$(mktemp -d)"
          MOUNT_ROOT="$(mktemp -d)"
          MOUNT="$MOUNT_ROOT/Linea"
          mkdir -p "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true; rm -rf "$STAGE" "$MOUNT_ROOT"' EXIT

          # staging 目录只放 App 和 /Applications 符号链接，用户挂载后可直接拖拽安装。
          ditto "$APP" "$STAGE/Linea.app"
          ln -s /Applications "$STAGE/Applications"

          # HFS+ 兼容更广；若新版 runner 不再支持创建，则回退 APFS。
          if ! hdiutil create \
            -volname "Linea ${VERSION}" \
            -srcfolder "$STAGE" \
            -ov -format UDZO -fs HFS+ \
            "$DMG"; then
            echo "HFS+ DMG 创建失败，回退 APFS" >&2
            rm -f "$DMG"
            hdiutil create \
              -volname "Linea ${VERSION}" \
              -srcfolder "$STAGE" \
              -ov -format UDZO -fs APFS \
              "$DMG"
          fi
          hdiutil verify "$DMG"

          hdiutil attach -nobrowse -noautoopen -readonly -mountpoint "$MOUNT" "$DMG"
          test -d "$MOUNT/Linea.app"
          test -L "$MOUNT/Applications"
          test "$(readlink "$MOUNT/Applications")" = "/Applications"
          test -x "$MOUNT/Linea.app/Contents/MacOS/Linea"
          test -s "$MOUNT/Linea.app/Contents/Resources/Assets.car"
          test -d "$MOUNT/Linea.app/Contents/_CodeSignature"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Linea.app"
          test "$(lipo -archs "$MOUNT/Linea.app/Contents/MacOS/Linea")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MOUNT/Linea.app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$MOUNT/Linea.app/Contents/Info.plist")" = "$BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$MOUNT/Linea.app/Contents/Info.plist")" = "14.0"
          # ad-hoc 签名未公证，spctl 预期拒绝，仅记录便于排查。
          spctl --assess --type execute --verbose=4 "$MOUNT/Linea.app" 2>&1 || true

          hdiutil detach "$MOUNT"
          rm -rf "$MOUNT_ROOT"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          shasum -a 256 -c "$DMG.sha256"

          ls -lh "$DMG" "$DMG.sha256"

      - name: Upload app DMG
        uses: actions/upload-artifact@v7
        with:
          name: Linea-macos-arm64-adhoc-signed-dmg
          path: |
            Linea-*.dmg
            Linea-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Linea-TestResults
          path: TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7
